<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Calibri, Arial, sans-serif">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1280" height="72" fill="#1B3A5C"/>
  <text x="40" y="28" fill="#FFFFFF" font-size="11" font-weight="300" letter-spacing="3" text-transform="uppercase">SAB SANTÉ — CARTOGRAPHIE DES RISQUES</text>
