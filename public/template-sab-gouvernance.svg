    <text x="336" y="18" text-anchor="middle" fill="#666" font-size="9" letter-spacing="1">RISQUE RÉSIDUEL</text>
    <text x="336" y="42" text-anchor="middle" fill="#E67E22" font-size="18" font-weight="700">Élevé</text>
    <text x="336" y="58" text-anchor="middle" fill="#999" font-size="9">Score: 12.8 | N-1: →</text>
  </g>

