  <text x="40" y="223" fill="#1B3A5C" font-size="11" font-weight="700" letter-spacing="1.5">RISQUES N2 ASSOCIÉS</text>

  <g transform="translate(30, 238)" font-size="11" fill="#333">
    <circle cx="12" cy="6" r="3" fill="#C0392B"/>
