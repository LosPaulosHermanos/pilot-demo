    <rect x="0" y="0" width="125" height="68" rx="4" fill="#FDECEA" stroke="#E74C3C" stroke-width="1"/>
    <text x="62" y="18" text-anchor="middle" fill="#666" font-size="9" letter-spacing="1">RISQUE BRUT</text>
    <text x="62" y="42" text-anchor="middle" fill="#C0392B" font-size="18" font-weight="700">Critique</text>
    <text x="62" y="58" text-anchor="middle" fill="#999" font-size="9">Score: 18.2 | N-1: ↗</text>
    <!-- Moyens de maîtrise -->
    <rect x="137" y="0" width="125" height="68" rx="4" fill="#FFF8E1" stroke="#F39C12" stroke-width="1"/>
