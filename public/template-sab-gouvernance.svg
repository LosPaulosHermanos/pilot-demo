    <text x="199" y="42" text-anchor="middle" fill="#E67E22" font-size="18" font-weight="700">Moyenne</text>
    <text x="199" y="58" text-anchor="middle" fill="#999" font-size="9">55/120 contrôles</text>
    <!-- Résiduel -->
