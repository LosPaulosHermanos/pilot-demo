    <circle cx="12" cy="28" r="3" fill="#C0392B"/>
    <text x="22" y="32">R1.2 — Non-conformité réglementaire Solvabilité II</text>
    <text x="350" y="32" fill="#C0392B" font-weight="600" text-anchor="end">Critique</text>

    <circle cx="12" cy="50" r="3" fill="#E67E22"/>
